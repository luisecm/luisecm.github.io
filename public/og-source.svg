<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#ffffff"/>

  <!-- The 1200x630 design band, centred in the square canvas at y=285 -->
  <g transform="translate(0,285)">
    <rect width="1200" height="630" fill="#ffffff"/>

    <g transform="translate(80,66)">
      <rect x="0" y="0" width="44" height="44" rx="10" fill="#eaf2ee" stroke="#0b5f4a" stroke-opacity=".25"/>
      <text x="22" y="29" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b5f4a">LC</text>
      <text x="60" y="29" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#141417">Luis Cardeña</text>
    </g>

    <text x="80" y="275" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#141417">I make shipping safe —</text>
    <text x="80" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#0b5f4a">then I help you ship.</text>

    <text x="80" y="412" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#70707a">QA Engineer · SDET · Product Developer</text>

    <line x1="80" y1="470" x2="1120" y2="470" stroke="#e5e5dd" stroke-width="1"/>

    <g font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" fill="#70707a">
      <text x="80" y="512">EXPERIENCE</text>
      <text x="380" y="512">PLATFORMS</text>
      <text x="760" y="512">BASED IN</text>
    </g>
    <g font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#141417">
      <text x="80" y="544">14 years</text>
      <text x="380" y="544">Web, iOS, Android, desktop</text>
      <text x="760" y="544">Mérida, Mexico</text>
    </g>

    <text x="1120" y="110" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#a0a0a8">luiscardena.com</text>
  </g>
</svg>
